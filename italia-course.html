<title>Italia in Tavola</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,50&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  :root{
    --sea:#173d5c; --ink:#1a222c; --line:rgba(242,236,226,.14);
    --paper:#f2ece2; --paper-dim:rgba(242,236,226,.66); --paper-faint:rgba(242,236,226,.42);
    --wine:#a63d55; --wine-deep:#7d2b41; --olive:#9aa86a; --gold:#d9b46a;
    --page:#f4f2ee; --page-2:#e9e5dd; --text:#1e232b; --text-dim:#5a6069; --text-faint:#8a9099; --rule:#d9d4ca;
    --serif:"Fraunces", Georgia, "Times New Roman", serif;
    --sans:"Manrope", "Segoe UI", system-ui, sans-serif;
    --sheet-peek:96px; --safe-b:env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--sea); color:var(--paper); font-family:var(--sans); font-size:14px; -webkit-text-size-adjust:100%; }
  button{ font:inherit; }
  canvas.gl{ position:fixed; inset:0; display:block; z-index:0; touch-action:none; }
  #ui{ position:fixed; inset:0; z-index:5; pointer-events:none; }
  #ui > *{ pointer-events:auto; }
  .glass{ background:rgba(26,34,44,.86); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); box-shadow:0 12px 40px rgba(6,14,24,.35); }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  /* ---------- top bar */
  #top{ position:absolute; left:0; right:0; top:0; padding:calc(10px + env(safe-area-inset-top,0px)) 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:10px; pointer-events:none;
    background:linear-gradient(rgba(23,61,92,.85), rgba(23,61,92,0)); }
  #top h1{ font-family:var(--serif); font-weight:400; font-variation-settings:"opsz" 96, "SOFT" 60; font-size:24px; margin:0; letter-spacing:-.01em; text-shadow:0 2px 12px rgba(0,0,0,.35); line-height:1; }
  #top h1 em{ font-style:italic; color:var(--gold); }
  #top .sub{ display:none; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--paper-dim); }
  #prog{ pointer-events:auto; display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:20px; font-size:12px; font-variant-numeric:tabular-nums; }
  #prog .bar{ width:56px; height:4px; background:rgba(255,255,255,.14); border-radius:2px; overflow:hidden; }
  #lang{ display:flex; border-radius:20px; overflow:hidden; pointer-events:auto; }
  #lang button{ background:none; border:0; color:var(--paper-dim); padding:6px 9px; font-size:11px; letter-spacing:.08em; cursor:pointer; min-height:32px; }
  #lang button.on{ background:rgba(255,255,255,.16); color:var(--paper); font-weight:700; }
  #prog .bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--olive),var(--gold)); transition:width .5s ease; }

  /* ---------- region list: strip on phones, rail on wide screens */
  #rail{ position:absolute; left:0; right:0; bottom:calc(var(--sheet-peek) + var(--safe-b) + 8px); display:flex; gap:6px; overflow-x:auto; padding:6px 12px; scrollbar-width:none; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity; }
  #rail::-webkit-scrollbar{ display:none; }
  #rail h4{ display:none; }
  #rail button.r{ flex:none; display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:20px; border:1px solid var(--line); background:rgba(26,34,44,.86); color:var(--paper); cursor:pointer; scroll-snap-align:start; white-space:nowrap; min-height:40px; }
  #rail button.r.active{ border-color:var(--wine); background:rgba(166,61,85,.35); }
  #rail button.r .sw{ width:9px; height:9px; border-radius:2px; flex:none; }
  #rail button.r .nm{ font-size:13px; }
  #rail button.r .dots{ display:flex; gap:3px; }
  #rail button.r .dots i{ width:4px; height:4px; border-radius:50%; background:rgba(255,255,255,.22); }
  #rail button.r .dots i.on{ background:var(--olive); }
  #rail.hidden{ display:none; }

  /* ---------- region sheet (bottom sheet on phones, side panel on wide screens) */
  #sheet{ position:absolute; left:0; right:0; bottom:0; height:calc(var(--sheet-peek) + var(--safe-b)); border-radius:18px 18px 0 0; display:flex; flex-direction:column; overflow:hidden;
    transform:translateY(105%); transition:transform .4s cubic-bezier(.2,.7,.2,1), height .4s cubic-bezier(.2,.7,.2,1); }
  #sheet.peek{ transform:none; height:calc(var(--sheet-peek) + var(--safe-b)); }
  #sheet.half{ transform:none; height:56vh; }
  #sheet.full{ transform:none; height:90vh; }
  @supports (height: 1dvh){ #sheet.half{ height:56dvh; } #sheet.full{ height:90dvh; } }
  #sheet .grip{ width:40px; height:4px; border-radius:2px; background:rgba(255,255,255,.28); margin:8px auto 0; }
  #sheet .head{ padding:6px 18px 12px; border-bottom:1px solid var(--line); position:relative; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
  #sheet .eyebrow{ font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold); display:flex; gap:10px; align-items:center; }
  #sheet .eyebrow .sw{ width:9px; height:9px; border-radius:2px; }
  #sheet h2{ font-family:var(--serif); font-weight:400; font-variation-settings:"opsz" 96, "SOFT" 40; font-size:30px; line-height:1; margin:6px 0 4px; letter-spacing:-.015em; text-wrap:balance; }
  #sheet .cap{ color:var(--paper-dim); font-size:12.5px; }
  #sheet .cap b{ color:var(--paper); font-weight:600; }
  #sheet .close{ position:absolute; right:12px; top:8px; width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--paper); cursor:pointer; font-size:18px; line-height:1; }
  #sheet .body{ overflow:auto; padding:6px 18px 24px; flex:1; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.2) transparent; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  #sheet p.intro{ font-size:14px; line-height:1.6; color:var(--paper-dim); margin:12px 0 4px; max-width:62ch; }
  #sheet section{ margin-top:18px; }
  #sheet section h3{ font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--paper-faint); margin:0 0 8px; font-weight:600; display:flex; align-items:center; gap:10px; }
  #sheet section h3::after{ content:""; flex:1; height:1px; background:var(--line); }
  ol.lessons{ list-style:none; margin:0; padding:0; display:grid; gap:6px; counter-reset:l; }
  ol.lessons li{ display:grid; grid-template-columns:26px 1fr auto; gap:10px; align-items:center; padding:10px 12px; border-radius:8px; background:rgba(255,255,255,.05); border:1px solid transparent; cursor:pointer; min-height:48px; }
  ol.lessons li.readable:hover{ border-color:rgba(255,255,255,.18); }
  ol.lessons li::before{ counter-increment:l; content:counter(l); font-family:var(--serif); color:var(--paper-faint); font-size:17px; text-align:center; }
  ol.lessons li.done::before{ content:"✓"; color:var(--olive); font-family:var(--sans); font-weight:700; font-size:14px; }
  ol.lessons li .t{ font-size:14px; line-height:1.3; }
  ol.lessons li .m{ display:block; font-size:11px; color:var(--paper-faint); margin-top:2px; letter-spacing:.04em; }
  ol.lessons li .go{ font-size:18px; color:var(--gold); }
  ol.lessons li.soon{ opacity:.55; cursor:default; }
  ol.lessons li.soon .go{ display:none; }
  .landmark{ display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; }
  .landmark .ico{ width:44px; height:44px; border-radius:8px; background:rgba(255,255,255,.06); border:1px solid var(--line); display:grid; place-items:center; font-family:var(--serif); font-size:20px; color:var(--gold); }
  .landmark b{ display:block; font-size:14px; }
  .landmark span{ color:var(--paper-dim); font-size:12.5px; line-height:1.5; }
  ul.wines{ list-style:none; margin:0; padding:0; display:grid; gap:6px; }
  ul.wines li{ display:grid; grid-template-columns:12px 1fr auto; gap:10px; align-items:center; padding:8px 10px; border-radius:6px; background:rgba(255,255,255,.04); }
  ul.wines li i{ width:12px; height:12px; border-radius:50%; }
  ul.wines li i.red{ background:#7d2b41; box-shadow:inset 0 0 0 2px #a63d55; }
  ul.wines li i.white{ background:#e9dc9a; box-shadow:inset 0 0 0 2px #cdbb6b; }
  ul.wines li i.rose{ background:#e8a1a8; }
  ul.wines li i.sparkling{ background:#f1e7b8; box-shadow:0 0 0 2px rgba(241,231,184,.35); }
  ul.wines li i.sweet{ background:#c88a3c; }
  ul.wines li span{ font-size:13px; }
  ul.wines li small{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--paper-faint); }
  .dishes{ display:flex; flex-wrap:wrap; gap:6px; }
  .dishes span{ font-size:12.5px; padding:6px 10px; border-radius:20px; border:1px solid var(--line); }
  .pair{ margin-top:10px; padding:10px 12px; border-left:2px solid var(--wine); background:rgba(166,61,85,.12); font-size:12.5px; line-height:1.5; border-radius:0 6px 6px 0; }
  .pair b{ color:var(--gold); font-weight:600; letter-spacing:.08em; font-size:10.5px; text-transform:uppercase; display:block; margin-bottom:2px; }
  #sheet .nav{ display:flex; justify-content:space-between; gap:10px; padding:10px 18px calc(10px + var(--safe-b)); border-top:1px solid var(--line); }
  #sheet .nav button{ font-size:13px; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--paper); cursor:pointer; min-height:44px; }
  #sheet .nav button.primary{ background:var(--wine); border-color:var(--wine); }

  /* ---------- reader (full screen, light page) */
  #reader{ position:fixed; inset:0; z-index:20; background:var(--page); color:var(--text); display:none; flex-direction:column; }
  #reader.open{ display:flex; }
  #reader .rbar{ flex:none; display:flex; align-items:center; gap:10px; padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px; background:var(--page); border-bottom:1px solid var(--rule); position:relative; }
  #reader .rbar .back{ display:flex; align-items:center; gap:6px; padding:8px 12px 8px 8px; border-radius:20px; border:1px solid var(--rule); background:#fff; color:var(--text); cursor:pointer; min-height:40px; font-weight:600; font-size:13px; }
  #reader .rbar .rk{ margin-left:auto; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); white-space:nowrap; }
  #reader .rbar .rprog{ position:absolute; left:0; right:0; bottom:-1px; height:3px; background:transparent; }
  #reader .rbar .rprog i{ display:block; height:100%; width:0; background:var(--wine); }
  #reader .rscroll{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  #reader article{ max-width:700px; margin:0 auto; padding:0 0 60px; }
  .rhead{ padding:26px 20px 6px; }
  .rhead .kicker{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--wine); margin:0 0 10px; font-weight:600; }
  .rhead h1{ font-family:var(--serif); font-weight:400; font-variation-settings:"opsz" 144, "SOFT" 30; font-size:clamp(32px, 8vw, 46px); line-height:1.02; letter-spacing:-.02em; margin:0 0 12px; text-wrap:balance; }
  .rhead .summary{ font-size:17px; line-height:1.5; color:var(--text-dim); margin:0; }
  .rhead .region{ display:inline-flex; align-items:center; gap:8px; margin-top:14px; font-size:12px; color:var(--text-dim); }
  .rhead .region i{ width:10px; height:10px; border-radius:2px; }
  figure{ margin:22px 0; }
  figure.hero{ margin:18px 0 8px; }
  figure img{ display:block; width:100%; height:auto; border-radius:0; background:var(--page-2); }
  figcaption{ padding:8px 20px 0; font-size:12.5px; line-height:1.5; color:var(--text-dim); }
  figcaption .credit{ display:block; font-size:11px; color:var(--text-faint); margin-top:2px; }
  figcaption .credit a{ color:inherit; }
  .rbody{ padding:8px 20px 0; font-size:17px; line-height:1.68; }
  .rbody > *{ max-width:66ch; }
  .rbody p{ margin:0 0 1.15em; }
  .rbody p.lead{ font-size:19px; line-height:1.55; color:var(--text); }
  .rbody p.lead::first-letter{ font-family:var(--serif); font-size:3.1em; float:left; line-height:.85; padding:.08em .12em 0 0; color:var(--wine); font-weight:500; }
  .rbody h2{ font-family:var(--serif); font-weight:500; font-variation-settings:"opsz" 72, "SOFT" 30; font-size:26px; line-height:1.15; letter-spacing:-.01em; margin:1.6em 0 .5em; text-wrap:balance; }
  .rbody strong{ font-weight:700; }
  .rbody ul{ padding-left:1.2em; margin:0 0 1.15em; }
  .rbody li{ margin:0 0 .5em; }
  .rbody figure{ margin:24px -20px; max-width:none; }
  .rbody figure img{ border-radius:0; }
  aside.facts, aside.tasting{ background:#fff; border:1px solid var(--rule); border-radius:10px; padding:16px 18px; margin:22px 0; font-size:15px; }
  aside h4, .recap h4{ margin:0 0 8px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--wine); font-weight:700; }
  aside.facts ul{ margin:0; padding-left:1.1em; }
  aside.facts li{ margin:0 0 .4em; line-height:1.5; }
  aside.tasting table{ width:100%; border-collapse:collapse; font:inherit; font-size:14.5px; color:var(--text); }
  aside.tasting th{ text-align:left; font-weight:600; color:var(--text-dim); padding:6px 10px 6px 0; vertical-align:top; width:34%; border-bottom:1px solid var(--rule); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  aside.tasting td{ padding:6px 0; border-bottom:1px solid var(--rule); line-height:1.45; }
  aside.tasting tr:last-child th, aside.tasting tr:last-child td{ border-bottom:0; }
  .recap{ margin:28px 0 0; padding:18px 20px; border-left:3px solid var(--olive); background:var(--page-2); border-radius:0 10px 10px 0; font-size:15px; }
  .recap ul{ margin:0; padding-left:1.1em; }
  .recap li{ margin:0 0 .4em; line-height:1.5; }
  .listen{ display:inline-flex; align-items:center; gap:8px; margin:16px 0 0; padding:10px 16px 10px 12px; border-radius:24px; border:1px solid var(--rule); background:#fff; color:var(--text); font-weight:600; font-size:14px; cursor:pointer; min-height:44px; }
  .listen:hover{ border-color:var(--wine); }
  .listen i{ width:26px; height:26px; border-radius:50%; background:var(--wine); color:#fff; display:grid; place-items:center; font-size:11px; font-style:normal; }
  .listen small{ color:var(--text-faint); font-weight:500; }
  .rplayer{ flex:none; display:none; border-top:1px solid var(--rule); background:#fff; padding:10px 14px calc(10px + var(--safe-b)); box-shadow:0 -8px 30px rgba(20,25,40,.08); }
  .rplayer.on{ display:block; }
  .rplayer .row{ display:flex; align-items:center; gap:10px; }
  .rplayer .row + .row{ margin-top:6px; justify-content:space-between; }
  .rplayer button{ border:1px solid var(--rule); background:#fff; color:var(--text); border-radius:20px; min-height:36px; padding:0 12px; font-size:12px; font-weight:600; cursor:pointer; }
  .rplayer .pp{ width:44px; height:44px; border-radius:50%; background:var(--wine); border-color:var(--wine); color:#fff; font-size:15px; padding:0; flex:none; }
  .rplayer .scrub{ flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; background:linear-gradient(90deg, var(--wine) var(--p,0%), var(--rule) var(--p,0%)); outline:none; }
  .rplayer .scrub::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--wine); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.3); }
  .rplayer .scrub::-moz-range-thumb{ width:16px; height:16px; border-radius:50%; background:var(--wine); border:2px solid #fff; }
  .rplayer .time{ font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:82px; text-align:right; }
  .rplayer .meta{ font-size:11px; color:var(--text-faint); letter-spacing:.04em; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rplayer .x{ border:0; color:var(--text-faint); font-size:18px; }
  .rfoot{ padding:28px 20px 0; }
  .rfoot .done{ width:100%; padding:14px; border-radius:10px; border:2px solid var(--wine); background:var(--wine); color:#fff; font-weight:700; font-size:15px; cursor:pointer; min-height:48px; }
  .rfoot .done.is-done{ background:#fff; color:var(--olive); border-color:var(--olive); }
  .rnext{ margin-top:18px; display:grid; grid-template-columns:1fr; gap:10px; }
  .rnext a{ display:block; text-decoration:none; color:var(--text); background:#fff; border:1px solid var(--rule); border-radius:10px; padding:14px 16px; }
  .rnext a small{ display:block; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); margin-bottom:4px; }
  .rnext a b{ font-family:var(--serif); font-weight:500; font-size:19px; }
  .rfoot details{ margin-top:22px; font-size:12px; color:var(--text-faint); }
  .rfoot details ul{ padding-left:1.1em; }
  .rfoot details a{ color:var(--text-dim); }
  .soon{ padding:30px 20px; }
  .soon p{ font-size:16px; line-height:1.6; color:var(--text-dim); }

  /* ---------- tooltip + hints */
  #tip{ position:absolute; left:0; top:0; padding:6px 10px; border-radius:6px; font-size:12px; white-space:nowrap; pointer-events:none !important; opacity:0; transition:opacity .15s; display:none; }
  #tip.show{ opacity:1; }
  #tip b{ font-family:var(--serif); font-size:14px; font-weight:500; display:block; }
  #tip span{ color:var(--paper-dim); }
  #hint{ position:absolute; left:12px; right:12px; top:calc(56px + env(safe-area-inset-top,0px)); text-align:center; padding:8px 14px; border-radius:20px; font-size:12px; color:var(--paper-dim); transition:opacity .6s; }
  #hint.fade{ opacity:0; pointer-events:none; }
  #sheet.half ~ #homeBtn, #sheet.full ~ #homeBtn{ display:none; }
  #homeBtn{ position:absolute; right:12px; bottom:calc(var(--sheet-peek) + var(--safe-b) + 62px); width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:rgba(26,34,44,.86); color:var(--paper); cursor:pointer; font-size:16px; }
  #labels{ position:absolute; inset:0; pointer-events:none !important; overflow:hidden; }
  #labels .lbl{ position:absolute; left:0; top:0; font-family:var(--serif); font-weight:500; font-variation-settings:"opsz" 48, "SOFT" 30; color:#fff; letter-spacing:.02em; white-space:nowrap;
    text-shadow:0 0 3px rgba(20,25,35,.95), 0 0 6px rgba(20,25,35,.8), 0 1px 2px rgba(0,0,0,.9); transition:opacity .3s; }
  #labels .lbl.dim{ opacity:.45; }
  #tiltBtn{ position:absolute; right:12px; bottom:calc(var(--sheet-peek) + var(--safe-b) + 108px); width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:rgba(26,34,44,.86); color:var(--paper); cursor:pointer; font-size:16px; }
  #sheet.half ~ #tiltBtn, #sheet.full ~ #tiltBtn{ display:none; }
  #loading{ position:fixed; inset:0; z-index:30; background:var(--sea); display:grid; place-items:center; font-family:var(--serif); font-size:20px; color:var(--paper-dim); transition:opacity .6s; padding:20px; text-align:center; }
  #loading.gone{ opacity:0; pointer-events:none; }

  /* ---------- wide screens */
  @media (min-width:900px){
    #top{ padding:18px 20px; background:none; justify-content:flex-start; gap:14px; align-items:baseline; right:440px; }
    #top h1{ font-size:30px; }
    #top .sub{ display:inline; }
    #prog{ margin-left:auto; }
    #rail{ left:20px; right:auto; top:78px; bottom:20px; width:236px; border-radius:10px; flex-direction:column; gap:0; overflow:auto; padding:6px 0 10px; scrollbar-width:thin; scroll-snap-type:none;
      background:rgba(26,34,44,.86); border:1px solid var(--line); backdrop-filter:blur(10px); }
    #rail h4{ display:block; margin:10px 16px 4px; font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--paper-faint); font-weight:600; }
    #rail button.r{ width:100%; border:0; border-left:2px solid transparent; border-radius:0; background:none; padding:7px 16px; min-height:0; }
    #rail button.r:hover, #rail button.r.hover{ background:rgba(255,255,255,.06); }
    #rail button.r.active{ border-left-color:var(--wine); background:rgba(166,61,85,.16); }
    #rail button.r .nm{ flex:1; font-size:13.5px; }
    #sheet{ left:auto; right:20px; top:18px; bottom:20px; height:auto; width:400px; border-radius:12px; transform:translateX(30px); opacity:0; pointer-events:none !important; transition:transform .45s cubic-bezier(.2,.7,.2,1), opacity .35s; }
    #sheet.peek, #sheet.half, #sheet.full{ transform:none; opacity:1; height:auto; pointer-events:auto !important; }
    #sheet .grip{ display:none; }
    #sheet .head{ padding:18px 22px 14px; cursor:default; }
    #sheet h2{ font-size:36px; }
    #sheet .body{ padding:6px 22px 20px; }
    #sheet .nav{ padding:12px 22px; }
    #tip{ display:block; }
    #hint{ left:50%; right:auto; top:auto; bottom:18px; transform:translateX(-50%); white-space:nowrap; }
    #homeBtn{ right:20px; bottom:20px; display:block; }

  const g = new THREE.CylinderGeometry(0, r, h, seg||7, 1);

function ellipseRing(aO,bO,aI,bI,h,color,t0,t1){
  const s = new THREE.Shape();
  if(t1-t0 >= Math.PI*2-1e-3){ s.absellipse(0,0,aO,bO,0,Math.PI*2,false,0); if(aI>0){ const hole = new THREE.Path(); hole.absellipse(0,0,aI,bI,0,Math.PI*2,true,0); s.holes.push(hole); } }
  else { const n = Math.max(12, Math.round(64*(t1-t0)/(Math.PI*2)));
    for(let i=0;i<=n;i++){ const t=t0+(t1-t0)*i/n; const x=aO*Math.cos(t), y=bO*Math.sin(t); i? s.lineTo(x,y): s.moveTo(x,y); }
    for(let i=n;i>=0;i--){ const t=t0+(t1-t0)*i/n; s.lineTo(aI*Math.cos(t), bI*Math.sin(t)); } s.closePath(); }

  const m = new THREE.Mesh(g, mat(color)); m.rotation.x = -Math.PI/2; return sh(m);
}

    const used = [...new Set([L.hero, ...[...L.html.matchAll(/data-img="([\w-]+)"/g)].map(m=>m[1])])];
    const hasAudio = !!((window.AUDIO_MANIFEST||{})[`${dir}:${lang}-${i+1}`]);
    const secs = ((window.AUDIO_MANIFEST||{})[`${dir}:${lang}-${i+1}`]||{}).seconds;
    const listenLabel = hasAudio ? `${T('listen')} <small>· ${secs ? Math.round(secs/60) : L.minutes} min</small>` : (('speechSynthesis' in window) ? T('listenBrowser') : '');
    article.innerHTML = `<header class="rhead"><p class="kicker">${esc(L.kicker)} · ${L.minutes} min</p><h1>${esc(L.title)}</h1><p class="summary">${esc(L.summary)}</p>${region}${listenLabel ? `<div><button class="listen" type="button"><i>▶</i>${listenLabel}</button></div>` : ''}</header>
      ${figureHtml(dir, credits, L.hero, L.heroCaption, 'hero')}
      <div class="rbody">${body}</div>
      <footer class="rfoot"><button class="done ${done?'is-done':''}" type="button">${done ? T('marked') : T('mark')}</button>
        <div class="rnext"><a href="#/${code}"><small>${T('backTo')}</small><b>${C.name}</b></a>${next}</div>
        <details><summary>${T('credits')}</summary><ul>${used.map(k => credits[k] ? `<li>${esc(k)}: <a href="${credits[k].source}" target="_blank" rel="noopener">${esc(credits[k].artist)}</a>, ${esc(credits[k].license)}</li>` : '').join('')}</ul></details></footer>`;
    const lb = article.querySelector('.listen'); if(lb) lb.addEventListener('click', () => player.start({code, i, title:L.title, src: hasAudio ? () => resolveAudio(dir, lang, i) : null, text: narrationText(L)}));
    const btn = article.querySelector('.done');
    btn.addEventListener('click', () => { const on = !progress.has(code+':'+i); setDone(code, i, on); btn.classList.toggle('is-done', on); btn.textContent = on ? T('marked') : T('mark'); });
    const recap = article.querySelector('.recap');
    if(recap && 'IntersectionObserver' in window){ const io = new IntersectionObserver(en => { if(en[0].isIntersecting){ if(!progress.has(code+':'+i)){ setDone(code, i, true); btn.classList.add('is-done'); btn.textContent = T('marked'); } io.disconnect(); } }, {root:rscroll, threshold:0.6}); io.observe(recap); }
  }
  rscroll.scrollTop = 0; reader.classList.add('open'); reader.querySelector('.rprog i').style.width = '0';
  document.title = L ? `${L.title} · Italia in Tavola` : 'Italia in Tavola';
}
function closeReader(){ reading = null; player.stop(); reader.classList.remove('open'); document.title = 'Italia in Tavola'; }
function narrationText(L){
  let h = L.html.replace(/<figure[\s\S]*?<\/figure>/g, ' ').replace(/<tr><th>(.*?)<\/th><td>(.*?)<\/td><\/tr>/g, ' $1: $2.\n').replace(/<h4>(.*?)<\/h4>/g, '\n$1.\n').replace(/<h2>(.*?)<\/h2>/g, '\n\n$1.\n\n').replace(/<li>([\s\S]*?)<\/li>/g, (m,t)=>'\n'+t.trim().replace(/\.$/,'')+'.\n').replace(/<\/p>|<\/aside>|<\/div>|<\/ul>/g, '\n').replace(/<[^>]+>/g, '');
  const d = document.createElement('textarea'); d.innerHTML = h; h = d.value;
  return `${L.title}.\n\n${L.summary}\n\n` + h.replace(/[ \t]+/g,' ').replace(/\n\s*\n+/g, '\n\n').trim();
}
// ============================================================ AUDIO SOURCES
// Narration ships as Opus in Ogg. Browsers that cannot play that (Safari before iOS 18.4) get the same
// packets repackaged on the fly into Apple's CAF container, which every Safari since 2017 plays.
const OGG_OK = (() => { try{ const a = document.createElement('audio'); return !!a.canPlayType && a.canPlayType('audio/ogg; codecs=opus') !== ''; }catch(e){ return false; } })();
function oggOpusToCaf(buf){
  const u = new Uint8Array(buf); const packets = []; let cur = [], pos = 0;
  while(pos + 27 <= u.length){
    if(u[pos]!==0x4f || u[pos+1]!==0x67 || u[pos+2]!==0x67 || u[pos+3]!==0x53) throw new Error('not an Ogg stream');
    const nseg = u[pos+26]; let p = pos + 27 + nseg;
    for(let k=0;k<nseg;k++){ const l = u[pos+27+k]; cur.push(u.subarray(p, p+l)); p += l; if(l < 255){ packets.push(cur); cur = []; } }
    pos = p;
  }
  if(packets.length < 3 || String.fromCharCode(...packets[0][0].subarray(0,8)) !== 'OpusHead') throw new Error('not Opus');
  const audio = packets.slice(2).map(parts => { if(parts.length === 1) return parts[0]; const n = parts.reduce((a,b)=>a+b.length,0); const o = new Uint8Array(n); let q=0; for(const b of parts){ o.set(b,q); q+=b.length; } return o; });
  // samples per packet from the first TOC byte (config -> frame size, code -> frame count)
  const toc = audio[0][0], cfg = toc >> 3, code = toc & 3;
  const ms = cfg < 12 ? [10,20,40,60][cfg % 4] : cfg < 16 ? [10,20][cfg % 2] : [2.5,5,10,20][cfg % 4];
  const frames = code === 0 ? 1 : code === 3 ? (audio[0][1] & 0x3f) : 2;
  const fpp = Math.round(ms * 48 * frames);
  const payload = audio.reduce((a,b)=>a+b.length,0);
  const varints = []; for(const pk of audio){ let n = pk.length; const bytes = [n & 0x7f]; n >>= 7; while(n > 0){ bytes.unshift((n & 0x7f) | 0x80); n >>= 7; } varints.push(...bytes); }
  const total = 8 + 44 + 24 + 16 + payload + 36 + varints.length;
  const out = new Uint8Array(total); const dv = new DataView(out.buffer); let o = 0;
  const str = t => { for(let k=0;k<4;k++) out[o++] = t.charCodeAt(k); };
  const i64 = v => { dv.setUint32(o, Math.floor(v / 4294967296)); dv.setUint32(o+4, v >>> 0); o += 8; };
  const i32 = v => { dv.setUint32(o, v >>> 0); o += 4; };
  str('caff'); dv.setUint16(o, 1); o += 2; dv.setUint16(o, 0); o += 2;
  str('desc'); i64(32); dv.setFloat64(o, 48000); o += 8; str('opus'); i32(0); i32(0); i32(fpp); i32(1); i32(0);
  str('chan'); i64(12); i32((100 << 16) | 1); i32(0); i32(0);
  str('data'); i64(4 + payload); i32(0); for(const pk of audio){ out.set(pk, o); o += pk.length; }
  str('pakt'); i64(24 + varints.length); i64(audio.length); i64(audio.length * fpp); i32(0); i32(0); out.set(varints, o); o += varints.length;
  return out;
}
async function resolveAudio(dir, lang, i){
  const base = `assets/audio/${dir}/${lang}-${i+1}`;
  if(!window.AUDIO_DATA) return base + '.mp3';                    // self-hosted: full-quality files on disk
  if(window.AUDIO_DATA[base + '.mp3']) return window.AUDIO_DATA[base + '.mp3'];
  const ogg = window.AUDIO_DATA[base + '.ogg']; if(!ogg) return null;
  if(OGG_OK) return ogg;
  try{ const buf = await (await fetch(ogg)).arrayBuffer(); return URL.createObjectURL(new Blob([oggOpusToCaf(buf)], {type:'audio/x-caf'})); }
  catch(e){ console.warn('narration repackaging failed', e); return null; }
}
window.__dbg = Object.assign(window.__dbg || {}, {oggOpusToCaf, resolveAudio, OGG_OK});
// ============================================================ AUDIO PLAYER (narration file, or the browser's own voice as a fallback)
const player = (() => {
  const bar = reader.querySelector('.rplayer'), pp = bar.querySelector('.pp'), scrub = bar.querySelector('.scrub'), time = bar.querySelector('.time'), meta = bar.querySelector('.meta'), rateBtn = bar.querySelector('.rate');
  const RATES = [1, 1.25, 1.5, 0.85]; let rateIx = 0, audio = null, mode = null, cur = null, speech = null, seeking = false;
  const fmt = t => { t = Math.max(0, Math.floor(t||0)); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
  const posKey = () => cur ? `iit-audio:${cur.code}:${lang}:${cur.i}` : null;
  function setPP(playing){ pp.textContent = playing ? '❚❚' : '▶'; pp.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
  function update(){ if(!audio) return; const d = audio.duration || 0; time.textContent = `${fmt(audio.currentTime)} / ${fmt(d)}`; if(!seeking && d){ const p = audio.currentTime/d*1000; scrub.value = p; scrub.style.setProperty('--p', (p/10)+'%'); } }
  function markRead(){ if(cur && !progress.has(cur.code+':'+cur.i)){ setDone(cur.code, cur.i, true); const b = article.querySelector('.done'); if(b){ b.classList.add('is-done'); b.textContent = T('marked'); } } }
  async function start(item){
    stop(); cur = item; bar.classList.add('on');
    let src = null;
    if(item.src){ meta.textContent = '…'; try{ src = await item.src(); }catch(e){ src = null; } if(cur !== item) return; }
    if(src){
      mode = 'file'; audio = new Audio(src); audio.preload = 'auto'; audio.playbackRate = RATES[rateIx];
      meta.textContent = T('narrated');
      try{ const saved = +localStorage.getItem(posKey()); if(saved > 5) audio.currentTime = saved; }catch(e){}
      audio.addEventListener('timeupdate', () => { update(); try{ localStorage.setItem(posKey(), String(Math.floor(audio.currentTime))); }catch(e){} });
      audio.addEventListener('loadedmetadata', update);
      audio.addEventListener('play', () => setPP(true)); audio.addEventListener('pause', () => setPP(false));
      audio.addEventListener('ended', () => { setPP(false); markRead(); try{ localStorage.removeItem(posKey()); }catch(e){} });
      audio.play().catch(()=>setPP(false));
      if('mediaSession' in navigator){ try{ navigator.mediaSession.metadata = new MediaMetadata({title:item.title, artist:'Italia in Tavola', album: course(item.code).name}); navigator.mediaSession.setActionHandler('play', ()=>audio.play()); navigator.mediaSession.setActionHandler('pause', ()=>audio.pause()); navigator.mediaSession.setActionHandler('seekbackward', ()=>skip(-15)); navigator.mediaSession.setActionHandler('seekforward', ()=>skip(15)); }catch(e){} }
    } else if('speechSynthesis' in window){
      mode = 'speech'; meta.textContent = T('browserVoice'); time.textContent = '—'; scrub.disabled = true;
      const paras = item.text.split(/\n\s*\n/).filter(Boolean); let k = 0;
      const voices = speechSynthesis.getVoices(); const want = lang === 'no' ? /^(nb|no|nn)/i : /^en/i; const voice = voices.find(v => want.test(v.lang) && /natural|neural|premium|enhanced|siri/i.test(v.name)) || voices.find(v => want.test(v.lang));
      if(!voice && lang === 'no' && !voices.some(v => /^(nb|no|nn)/i.test(v.lang))) meta.textContent = T('noVoice');
      const speakNext = () => { if(k >= paras.length){ setPP(false); markRead(); return; } const u = new SpeechSynthesisUtterance(paras[k++]); u.lang = lang === 'no' ? 'nb-NO' : 'en-GB'; if(voice) u.voice = voice; u.rate = RATES[rateIx]; u.onend = speakNext; u.onerror = () => setPP(false); speech = u; time.textContent = `${k} / ${paras.length}`; speechSynthesis.speak(u); };
      speechSynthesis.cancel(); speakNext(); setPP(true);
    } else { meta.textContent = T('noVoice'); }
  }
  function toggle(){ if(mode === 'file' && audio){ audio.paused ? audio.play() : audio.pause(); } else if(mode === 'speech'){ if(speechSynthesis.speaking && !speechSynthesis.paused){ speechSynthesis.pause(); setPP(false); } else { speechSynthesis.resume(); setPP(true); } } }
  function skip(d){ if(audio){ audio.currentTime = Math.max(0, Math.min((audio.duration||1e9), audio.currentTime + d)); update(); } }
  function stop(){ if(audio){ audio.pause(); audio.src = ''; audio = null; } if(mode === 'speech'){ speechSynthesis.cancel(); } mode = null; cur = null; scrub.disabled = false; scrub.value = 0; scrub.style.setProperty('--p','0%'); time.textContent = '0:00 / 0:00'; setPP(false); bar.classList.remove('on'); }
  pp.addEventListener('click', toggle);
  bar.querySelector('.back15').addEventListener('click', () => skip(-15));
  bar.querySelector('.fwd15').addEventListener('click', () => skip(15));
  bar.querySelector('.x').addEventListener('click', stop);
  rateBtn.addEventListener('click', () => { rateIx = (rateIx+1) % RATES.length; rateBtn.textContent = RATES[rateIx] + '×'; if(audio) audio.playbackRate = RATES[rateIx]; });
  scrub.addEventListener('input', () => { seeking = true; if(audio && audio.duration){ time.textContent = `${fmt(scrub.value/1000*audio.duration)} / ${fmt(audio.duration)}`; scrub.style.setProperty('--p', (scrub.value/10)+'%'); } });
  scrub.addEventListener('change', () => { if(audio && audio.duration) audio.currentTime = scrub.value/1000*audio.duration; seeking = false; update(); });
  if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
  return {start, stop, toggle};
})();
rscroll.addEventListener('scroll', () => { const max = rscroll.scrollHeight - rscroll.clientHeight; reader.querySelector('.rprog i').style.width = (max>0 ? rscroll.scrollTop/max*100 : 0)+'%'; }, {passive:true});
reader.querySelector('.back').addEventListener('click', () => { location.hash = '#/'+(reading ? reading.code : ''); });

// ============================================================ ROUTER
function route(){
  const m = /^#\/?([A-Z]{2}-\d{2})?(?:\/(\d+))?/.exec(location.hash || '#/');
  const code = m && m[1] && COURSE[m[1]] ? m[1] : null; const n = m && m[2] ? +m[2] : 0;
  if(!code){ closeReader(); if(selected) home(); return; }
  select(code);
  if(n >= 1 && n <= 4){ openReader(code, n-1); if(selected===code) select(code); } else closeReader();
}
window.addEventListener('hashchange', route);
window.addEventListener('keydown', e => { if(e.target.tagName==='INPUT') return; if(e.key==='Escape'){ location.hash = reading ? '#/'+reading.code : '#/'; } if(reading) return; if(e.key==='n'||e.key==='ArrowRight') step(1); if(e.key==='p'||e.key==='ArrowLeft') step(-1); });
refreshProgress();

// ============================================================ LOOP
const clock = new THREE.Clock();
function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
function loop(){
  requestAnimationFrame(loop);
  if(ctl.tTarget){
    const k = Math.min(1, (performance.now()-ctl.tStart)/1000/ctl.tDur), e = ease(k);
    ctl.target.copy(ctl.from.target).lerp(ctl.tTarget, e);
    ctl.dist = ctl.from.dist + (ctl.tDist-ctl.from.dist)*e; ctl.theta = ctl.from.theta + (ctl.tTheta-ctl.from.theta)*e; ctl.phi = ctl.from.phi + (ctl.tPhi-ctl.from.phi)*e;
    if(k>=1) ctl.tTarget = null;
  }
  applyCamera();
  if(reading) return;
  updateOverlays();
  renderer.render(scene, camera);
}
function begin(){
  applyLang();
  buildTerrain().then(() => {
    placeLandmarks();
    const q = new URLSearchParams(location.search); if(q.has('instant')) ctl.tDur = 0.001;
    applyCamera();
    document.getElementById('loading').classList.add('gone');
    loop();
    if(q.get('region')) location.hash = '#/'+q.get('region') + (q.get('lesson') ? '/'+q.get('lesson') : '');
    route();
    if(q.get('scroll')) setTimeout(()=>{ rscroll.scrollTop = +q.get('scroll'); }, 300);
  }).catch(err => { document.getElementById('loading').textContent = 'Could not load the terrain: ' + err; });
}
if(location.search.includes('instant')) begin(); else if(document.fonts && document.fonts.load){ Promise.race([document.fonts.load('500 54px Fraunces'), new Promise(r=>setTimeout(r, 2500))]).then(begin, begin); } else begin();
})();
</script>
