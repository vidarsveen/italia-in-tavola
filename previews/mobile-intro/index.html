<head>

<style>
*{box-sizing:border-box}body{margin:0;background:#101e23;color:#f6eee0;font-family:system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #e9bc72;outline-offset:4px}.layout{min-height:100svh;display:grid;grid-template-columns:minmax(270px,440px) minmax(320px,390px);justify-content:center;align-items:center;gap:80px;padding:32px}.notes{max-width:400px}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:11px;color:#d8b574}.notes h1{font:normal 56px/1.04 Georgia,serif;margin:24px 0}.notes p{color:#b7c1c0;line-height:1.7}.notes small{display:block;color:#9ba7a8;line-height:1.6}.lang{display:flex;gap:8px;margin:26px 0}.lang button{background:transparent;color:inherit;border:1px solid #607172;border-radius:24px;padding:10px 17px;min-height:44px}.lang button[aria-pressed=true]{background:#f3e9d7;color:#152e32;border-color:#f3e9d7}.preview{width:100%;max-width:390px}.stage{position:relative;aspect-ratio:390/780;overflow:hidden;background:radial-gradient(ellipse at 80% 80%,#34585b,transparent 65%),#17383d;border:1px solid #506462;border-radius:24px;isolation:isolate}.brand{position:absolute;top:25px;left:26px;z-index:4;font:18px Georgia,serif;color:#e4ca98}.scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .5s}.scene.active{opacity:1}.copy{position:absolute;left:26px;right:26px;top:71px;z-index:3}.copy .n{font-size:10px;letter-spacing:.2em;color:#d8b574;text-transform:uppercase}.copy h2{font:normal 34px/1.08 Georgia,serif;letter-spacing:-.025em;margin:10px 0 0;max-width:330px}.screen{position:absolute;width:82%;left:9%;top:185px;border-radius:13px;border:1px solid #8e9c8c;box-shadow:0 18px 50px #0008;transform:translateY(var(--pan,0px)) scale(var(--zoom,1));transform-origin:50% 35%;overflow:hidden}.screen img{display:block;width:100%;height:auto}.answer{position:absolute;inset:0;opacity:0;transition:opacity .3s}.shade{position:absolute;inset:auto 0 0;height:85px;background:linear-gradient(transparent,#17383d);z-index:2;pointer-events:none}.end{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:35px;background:#17383d;z-index:5}.end h2{font:normal 59px/1.03 Georgia,serif;margin:20px 0}.end em{color:#e4ca98;font-weight:normal}.end p{font-size:17px;line-height:1.7;color:#dce4dc}.end .line{width:50px;border-top:1px solid #d8b574;margin:20px}.controls{padding:16px 4px 0}.row{display:flex;align-items:center;gap:12px}.row button{border:1px solid #667b7a;border-radius:22px;background:transparent;color:inherit;min-height:44px;padding:8px 18px}.row output{margin-left:auto;color:#c2cecc;font-variant-numeric:tabular-nums;font-size:12px}.timeline{width:100%;accent-color:#d8b574;margin:15px 0;height:20px}.status{font-size:11px;letter-spacing:.04em;color:#aab9b7;margin:0}.mobileLang{position:absolute;right:18px;top:18px;z-index:8;margin:0}.mobileLang button{padding:7px 9px;font-size:11px;min-height:36px;background:#17383d}.brand{max-width:180px}
@media(max-width:760px){.layout{display:block;padding:12px;min-height:100svh}.notes{display:none}.preview{margin:auto}.stage{border-radius:18px}.controls{padding-top:10px}}
@media(prefers-reduced-motion:reduce){.scene,.answer{transition:none}.screen{transform:none}}
.soundrow{display:flex;align-items:center;gap:12px;margin-top:10px}.soundrow .status{flex:1}
.scene{transition:none}.scene .copy{opacity:0}.scene.active .copy{opacity:1}.screen{width:76%;left:12%;top:185px;transform-origin:50% 85%;background:#f4f2ee;will-change:transform}.shade{z-index:9;height:40px}.brand{z-index:12}.mobileLang{z-index:12}.end{z-index:11}
.soundrow button{background:transparent;color:#e4ca98;border:1px solid #667b7a;border-radius:20px;padding:9px 14px;min-height:44px}.credit{font-size:11px;line-height:1.6;color:#abbdb9;margin-top:14px}.credit a{color:#e4ca98}
</style>

<body><main class="layout">
<aside class="notes"><div class="eyebrow">Italia in Tavola · Preview 01</div><h1 id="introHeading"></h1><p id="introText"></p><div class="lang"><button data-lang="no">Norsk</button><button data-lang="en">English</button></div><small id="note"></small></aside>
<section class="preview" aria-label="Intro preview"><div class="stage" id="stage">
<div class="brand">Italia <i>in Tavola</i></div><div class="lang mobileLang"><button data-lang="no">NO</button><button data-lang="en">EN</button></div>
<div id="scenes"></div><div class="shade"></div></div>
<div class="controls"><p><a id="enter" style="display:block;text-align:center;background:#f3e9d7;color:#152e32;border-radius:24px;padding:13px;text-decoration:none" href="../../">Åpne kartet →</a></p><div class="row"><button id="play"></button><button id="replay"></button><output id="time">0:00 / 0:20</output></div><input class="timeline" id="seek" type="range" min="0" max="20" step=".05" value="0" aria-label="Timeline"><div class="soundrow"><button id="mute" aria-pressed="false"></button><p class="status" id="status" role="status"></p></div><p class="credit">“Bushwick Tarantella” — Kevin MacLeod (<a href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1300002" target="_blank" rel="noopener">incompetech.com · Source</a>). <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.<br><span id="editCredit"></span> · <a href="credits.html">Photo credits / Fotokreditering</a></p></div>
</section></main>
<script>
const text={no:{heading:'En liten smak av Italia.',intro:'20 sekunder gjennom kartet, historiene og maten. Et separat utkast du kan spille av, stoppe og bla i.',note:'Ekte skjermbilder fra kurset. Ingen endringer i selve kurset. Musikk legges til når en egnet innspilling av «’O sole mio» er klar.',play:'Spill av',pause:'Pause',replay:'Fra starten',status:'FORHÅNDSVISNING · UTEN MUSIKK',titles:['Reis gjennom Italia','Mat, vin og historier','Test det du har lært','Lag bistecca hjemme','Ta med deg lydboken','Over 100 oppskrifter'],tags:['20 regioner','Artikler med bilder','Quizer med forklaringer','Oppskrifter trinn for trinn','Lytt i ditt eget tempo','Til ditt eget kjøkken'],end:'Norsk og engelsk.<br>Hele Italia ved bordet.'},en:{heading:'A little taste of Italy.',intro:'20 seconds through the map, the stories and the food. A separate draft to play, pause and explore.',note:'Real screens from the course. The course itself is unchanged. Music will follow once a suitable recording of “’O sole mio” is ready.',play:'Play',pause:'Pause',replay:'Replay',status:'REVIEW PREVIEW · NO MUSIC',titles:['Explore Italy','Food, wine and stories','Test what you’ve learned','Cook bistecca at home','Take the audiobook along','Over 100 recipes'],tags:['20 regions','Illustrated articles','Quizzes with explanations','Step-by-step recipes','Listen at your own pace','For your own kitchen'],end:'English and Norwegian.<br>Italy, at your table.'}};
const names=['map','article','quiz','recipe','audio','recipes'];let lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'no',position=0,playing=false,last=0;
text.no.note='Ekte skjermbilder lagt som en kortstokk. Kortene ligger rett over hverandre og glir rolig til side. Musikk: «Bushwick Tarantella» av Kevin MacLeod, brukt med kreditering under CC BY 4.0.';
text.en.note='Real course screens in a deck of cards. Upright cards share the same position; only the outgoing card slides. Music: “Bushwick Tarantella” by Kevin MacLeod, used with attribution under CC BY 4.0.';
text.no.status='KORTSTOKK · BUSHWICK TARANTELLA';text.en.status='CARD DECK · BUSHWICK TARANTELLA';
document.getElementById('enter').addEventListener('click',()=>{try{localStorage.setItem('iit-seen','1')}catch(e){}});
const music=new Audio('bushwick-tarantella-20s.mp3');music.preload='auto';music.volume=.32;let playRequest=0;
const $=id=>document.getElementById(id);const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function render(){const t=text[lang];$('enter').textContent=lang==='no'?'Åpne kartet →':'Open the map →';$('enter').href='../../'+(location.hostname==='127.0.0.1'&&!location.pathname.startsWith('/site/')?'italia-course.html':'')+'?lang='+lang+'#/';document.documentElement.lang=lang==='no'?'nb':'en';$('introHeading').textContent=t.heading;$('introText').textContent=t.intro;$('note').textContent=t.note;$('replay').textContent=t.replay;$('status').textContent=t.status;$('seek').setAttribute('aria-label',lang==='no'?'Tidslinje':'Timeline');document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
$('scenes').innerHTML=names.map((name,i)=>`<div class="scene" data-scene="${i}"><div class="copy"><span class="n">${t.tags[i]}</span><h2>${t.titles[i]}</h2></div><div class="screen"><img src="screens/${lang}-${name}.jpg" alt="${t.titles[i]}" draggable="false">${name==='quiz'?`<img class="answer" src="screens/${lang}-answer.jpg" alt="${lang==='no'?'Svaret forklart':'Answer explained'}">`:''}</div></div>`).join('')+`<div class="scene end" data-scene="6"><div class="eyebrow">20 regioni · Una tavola</div><h2>Italia<br><em>in Tavola</em></h2><div class="line"></div><p>${t.end}</p></div>`;draw();}
function draw(){const index=Math.min(6,Math.floor(position/3));const u=Math.max(0,Math.min(1,(position-index*3-1.65)/1.35)),slide=reduced?0:u*u*(3-2*u);
document.querySelectorAll('.scene').forEach((s,i)=>{const depth=i-index,visible=i===6?index===6:depth>=0&&depth<=1;
s.classList.toggle('active',i===index);s.style.opacity=visible?'1':'0';s.style.zIndex=i===6?'11':String(8-i);s.setAttribute('aria-hidden',String(i!==index));
const card=s.querySelector('.screen');if(card){const direction=index%2?-1:1;card.style.transform=depth===0?`translateX(${direction*slide*150}%)`:`translateX(0)`;}
});const answer=document.querySelector('.answer');if(answer)answer.style.opacity=position>=7.1?'1':'0';$('time').textContent=`0:${String(Math.floor(position)).padStart(2,'0')} / 0:20`;$('seek').value=position;$('play').textContent=playing?text[lang].pause:text[lang].play;}
function soundLabel(){$('mute').textContent=music.muted?(lang==='no'?'Slå på lyd':'Unmute'):(lang==='no'?'Demp lyd':'Mute');$('mute').setAttribute('aria-pressed',String(music.muted));$('editCredit').textContent=lang==='no'?'Redigert til et utdrag på 20 sekunder med inn- og uttoning.':'Edited to a 20-second excerpt with fades.';}
function pause(){playRequest++;music.pause();playing=false;draw();}
function seek(seconds){pause();position=Math.max(0,Math.min(20,seconds));music.currentTime=position;draw();}
async function play(){const request=++playRequest;if(position>=20)position=0;music.currentTime=position;try{await music.play();if(request!==playRequest)return;playing=true;$('status').textContent=text[lang].status;draw();}catch(e){if(request!==playRequest)return;playing=false;$('status').textContent=lang==='no'?'Lyden kunne ikke startes. Prøv igjen.':'Audio could not start. Please try again.';draw();}}
function frame(){if(playing){position=Math.min(20,music.currentTime);draw();}requestAnimationFrame(frame);}
music.addEventListener('ended',()=>{playing=false;position=20;draw();});
$('play').onclick=()=>playing?pause():play();$('replay').onclick=()=>{seek(0);play();};$('seek').oninput=e=>seek(+e.target.value);$('mute').onclick=()=>{music.muted=!music.muted;soundLabel();};document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;render();soundLabel();});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});render();soundLabel();requestAnimationFrame(frame);
window.introPreview={seek,get state(){return {lang,position,playing,audioTime:music.currentTime,muted:music.muted,duration:music.duration,volume:music.volume}}};
</script></body></html>
